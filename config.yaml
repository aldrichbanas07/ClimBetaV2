# kilter-coach configuration

board: kilter                          # boardlib board key (Aurora backend)
layout_name: "Kilter Board Original"   # must match layouts.name in the Aurora sqlite db
db_path: cache/kilter_db.sqlite3       # cached copy of the Aurora sqlite db (holes/placements/climbs)
db_refresh_days: 7                     # re-download the db if the cached copy is older than this

# contact detection tuning (see contact_detection.py) - these are starting points,
# expect to retune per filming setup (camera distance, resolution, frame rate)
contact_radius_px: 40
dwell_frames: 5
min_visibility: 0.5  # ignore pose landmarks below this MediaPipe visibility score (avoids extrapolated/occluded positions)

# move segmentation (see moves.py) - cleans the deliberately over-eager raw
# contact stream into the holds a limb genuinely occupied
merge_gap_frames: 8     # re-contacts on the same hold within this many frames are one occupancy (the gap counts as a regrip)
min_hold_time_s: 0.25   # shorter occupancies are treated as flybys, not held positions
truncate_after_finish: true  # drop everything after the finish hold is reached (the climber coming off the wall isn't climbing)

# movement metrics (see metrics.py)
velocity_window_frames: 15  # trailing window for the smoothness/consistency velocity ratio
approach_window_frames: 10  # frames just before a contact's start, averaged into its "approach velocity"

# pose estimation (see pose.py)
pose_model_variant: full   # lite | full | heavy - accuracy/speed tradeoff, see MediaPipe docs
pose_model_path: cache/pose_landmarker_full.task

# coaching
anthropic_api_key_env: ANTHROPIC_API_KEY
anthropic_model: claude-opus-5
anthropic_max_tokens: 16000   # the step-by-step analysis is one entry per move, so this scales with move count
